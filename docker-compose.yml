services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"   # ⬅ host 5433, container tetap 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sales-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: andriputra/sales-system:backend-latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "8081:8081"
    networks:
      - sales-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8081/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: andriputra/sales-system:frontend-latest
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8081
      DATABASE_URL: ${DATABASE_URL}
      LEADGEN_BACKEND_URL: ${LEADGEN_BACKEND_URL}
    ports:
      - "3000:3000"
    networks:
      - sales-net

volumes:
  postgres_data:

networks:
  sales-net:
    driver: bridge
