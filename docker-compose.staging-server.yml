# Compose file khusus deploy STAGING ke server 202.50.203.136 via CI/CD
# (GitHub Actions, branch "staging"). Pull image jadi dari Docker Hub
# (:backend-staging / :frontend-staging), BUKAN build lokal -- beda dari
# docker-compose.staging.yml (file lokal WSL, untracked, dipakai buat dev
# lokal via `docker compose ... build`, JANGAN disatukan/ditimpa).
#
# Dijalankan di server SELALU dengan flag eksplisit:
#   docker compose -f docker-compose.staging-server.yml -p sales-staging pull
#   docker compose -f docker-compose.staging-server.yml -p sales-staging up -d
# -p sales-staging memisahkan total dari compose project production
# (docker-compose.yml, project default) -- container/network/volume tidak
# pernah tumpang tindih meski dijalankan di host yang sama.

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER_STAGING:-sales_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_STAGING}
      POSTGRES_DB: ${POSTGRES_DB_STAGING:-salesdb_staging}
    ports:
      - "5434:5432"   # host 5434, beda dari production (5433)
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - sales-staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: andriputra/sales-system:backend-staging
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8081   # PENTING: port INTERNAL container, sengaja sama dgn production (bukan 8091) --
                        # frontend/next.config.mjs (committed di git) hardcode proxy ke "http://backend:8081",
                        # dievaluasi saat BUILD TIME jadi tidak bisa dioverride via env runtime. Host-side
                        # tetap dibedakan lewat port mapping di bawah (8091), bukan lewat APP_PORT ini.
      UPLOAD_DIR: /app/uploads
      DB_DSN: postgres://${POSTGRES_USER_STAGING:-sales_staging}:${POSTGRES_PASSWORD_STAGING}@postgres:5432/${POSTGRES_DB_STAGING:-salesdb_staging}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET_STAGING}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE_STAGING}
    ports:
      - "8091:8081"   # host 8091 (beda dari production 8081) -> container 8081 (sama internal, lihat komentar di atas)
    volumes:
      - uploads_staging:/app/uploads
    networks:
      - sales-staging-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8081/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: andriputra/sales-system:frontend-staging
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_STAGING}
      LEADGEN_BACKEND_URL: ${LEADGEN_BACKEND_URL_STAGING}
    ports:
      - "3010:3000"   # container Next.js standalone listen di 3000 default (lihat Dockerfile EXPOSE), host 3010
    networks:
      - sales-staging-net

volumes:
  postgres_data_staging:
  uploads_staging:
    # Nama eksplisit agar backup/restore selalu menunjuk volume yang sama.
    name: sales-staging_uploads_staging

networks:
  sales-staging-net:
    driver: bridge
