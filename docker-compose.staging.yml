# Local Mini ERP staging stack. Load secrets explicitly, for example:
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
# DATABASE_URL_STAGING_LOCAL may be set when the frontend's leadgen database
# is different from the local staging PostgreSQL service.

services:
  postgres-staging:
    image: postgres:15
    container_name: sales-system-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER_STAGING:-sales_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_STAGING:?POSTGRES_PASSWORD_STAGING is required}
      POSTGRES_DB: ${POSTGRES_DB_STAGING:-salesdb_staging}
    ports:
      - "5434:5432"   # beda dari produksi/lokal existing (5433)
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - sales-net-staging

  backend-staging:
    build:
      context: ./backend
    container_name: sales-system-staging-backend
    restart: unless-stopped
    depends_on:
      - postgres-staging
    environment:
      APP_PORT: 8081
      DB_DSN: postgres://${POSTGRES_USER_STAGING:-sales_staging}:${POSTGRES_PASSWORD_STAGING:?POSTGRES_PASSWORD_STAGING is required}@postgres-staging:5432/${POSTGRES_DB_STAGING:-salesdb_staging}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET_STAGING}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE_STAGING:-false}
    ports:
      - "8091:8081"   # beda dari produksi/lokal existing (8081)
    networks:
      - sales-net-staging

  frontend-staging:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend-staging:8081
    container_name: sales-system-staging-frontend
    restart: unless-stopped
    depends_on:
      - backend-staging
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8091
      DATABASE_URL: ${DATABASE_URL_STAGING_LOCAL:-postgres://${POSTGRES_USER_STAGING:-sales_staging}:${POSTGRES_PASSWORD_STAGING:?POSTGRES_PASSWORD_STAGING is required}@postgres-staging:5432/${POSTGRES_DB_STAGING:-salesdb_staging}?sslmode=disable}
      LEADGEN_BACKEND_URL: ${LEADGEN_BACKEND_URL_STAGING:-http://localhost:3100}
    ports:
      - "3010:3000"   # beda dari produksi/lokal existing (3000)
    networks:
      - sales-net-staging

volumes:
  postgres_data_staging:

networks:
  sales-net-staging:
    driver: bridge
