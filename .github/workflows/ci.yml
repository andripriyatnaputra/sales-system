name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "staging" ]
  workflow_dispatch:

jobs:
  # =========================
  # 1️⃣ BACKEND TEST
  # =========================
  backend-test:
    runs-on: ubuntu-24.04

    services:
      postgres_test:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sales_db_test
          POSTGRES_USER: admin_sales_test
          POSTGRES_PASSWORD: secret_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      - name: Run backend tests
        working-directory: backend
        env:
          DB_DSN: postgres://admin_sales_test:secret_test@localhost:5433/sales_db_test?sslmode=disable
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
        run: |
          go mod tidy
          go test -v ./...

      - name: Validate production Compose configuration
        env:
          POSTGRES_USER: sales
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: salesdb
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
          AUTH_COOKIE_SECURE: "true"
          LEADGEN_BACKEND_URL: http://leadgen:3100
        run: docker compose config --quiet

  # =========================
  # 2️⃣ BACKEND BUILD & PUSH
  # =========================
  # Tag production (*-latest) HANYA dari main/master, tag staging (*-staging)
  # HANYA dari branch staging -- 2 step terpisah & mutually exclusive by
  # `if:` branch check, SENGAJA tidak digabung jadi 1 step dgn tag
  # kondisional, supaya gampang dicek sekilas tidak ada percampuran tag
  # antar environment.
  backend-build:
    runs-on: ubuntu-24.04
    needs: backend-test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image (production tag)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            andriputra/sales-system:backend-latest
            andriputra/sales-system:backend-${{ github.sha }}

      - name: Build & push backend image (staging tag)
        if: github.ref == 'refs/heads/staging'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            andriputra/sales-system:backend-staging
            andriputra/sales-system:backend-staging-${{ github.sha }}

  # =========================
  # 3️⃣ FRONTEND BUILD & PUSH
  # =========================
  frontend-typecheck:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend image (production tag)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            andriputra/sales-system:frontend-latest
            andriputra/sales-system:frontend-${{ github.sha }}

      - name: Build & push frontend image (staging tag)
        if: github.ref == 'refs/heads/staging'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            andriputra/sales-system:frontend-staging
            andriputra/sales-system:frontend-staging-${{ github.sha }}

  # =========================
  # 4️⃣ DEPLOY TO STAGING SERVER
  # =========================
  # HANYA jalan dari branch staging (never main/master) -- deploy production
  # TETAP manual seperti sebelumnya, tidak diotomasi di sini. Compose project
  # "-p sales-staging" + file docker-compose.staging-server.yml terpisah
  # total dari compose project production di server yang sama.
  deploy-staging:
    runs-on: ubuntu-24.04
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v7

      - name: Upload staging Compose configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging-server.yml"
          target: "~/sales-system-staging"
          overwrite: true

      - name: Upload staging migrations
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "backend/database/migrations/*.sql"
          target: "~/sales-system-staging/backend/database"
          strip_components: 2
          overwrite: true

      - name: Upload staging integrity audit
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "ops/audit_staging_integrity.sql"
          target: "~/sales-system-staging"
          strip_components: 1
          overwrite: true

      - name: Upload staging storage migration script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "ops/migrate_staging_uploads.sh"
          target: "~/sales-system-staging"
          strip_components: 1
          overwrite: true

      - name: Upload staging storage backup scripts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "ops/backup_staging_all.sh,ops/backup_staging_uploads.sh,ops/test_restore_staging_uploads.sh,ops/backup_staging_db.sh,ops/test_restore_staging_db.sh"
          target: "~/sales-system-staging"
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/sales-system-staging
            set -euo pipefail
            set -a
            source .env.staging
            set +a
            POSTGRES_USER_STAGING="${POSTGRES_USER_STAGING:-sales_staging}"
            POSTGRES_DB_STAGING="${POSTGRES_DB_STAGING:-salesdb_staging}"
            UPLOAD_VOLUME="sales-staging_uploads_staging"
            compose="docker compose -f docker-compose.staging-server.yml -p sales-staging"
            $compose pull
            if ! docker volume inspect "$UPLOAD_VOLUME" >/dev/null 2>&1; then
              docker volume create "$UPLOAD_VOLUME" >/dev/null
            fi
            $compose up -d postgres
            until $compose exec -T postgres pg_isready -U "$POSTGRES_USER_STAGING" -d "$POSTGRES_DB_STAGING"; do sleep 2; done
            chmod +x migrate_staging_uploads.sh
            ./migrate_staging_uploads.sh
            apply_migration() {
              local migration="$1"
              local version checksum
              version="$(basename "$migration" .sql)"
              checksum="$(sha256sum "$migration" | awk '{print $1}')"

              {
                cat <<SQL
            BEGIN;
            SELECT pg_advisory_xact_lock(hashtext('sales-staging-schema-migrations'));
            CREATE TABLE IF NOT EXISTS schema_migrations (
                version TEXT PRIMARY KEY,
                checksum TEXT NOT NULL,
                applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
            );
            SELECT EXISTS (
                SELECT 1 FROM schema_migrations WHERE version = :'version'
            ) AS migration_is_applied \\gset
            SELECT COALESCE((
                SELECT checksum = :'checksum'
                FROM schema_migrations
                WHERE version = :'version'
            ), true) AS checksum_is_valid \\gset
            \\if :checksum_is_valid
            \\if :migration_is_applied
            \\echo Skipping already applied migration :version
            \\else
            SQL
                cat "$migration"
                cat <<SQL
                INSERT INTO schema_migrations (version, checksum)
                VALUES (:'version', :'checksum');
            \\endif
            \\else
            \\echo Migration checksum mismatch for :version
            \\quit 1
            \\endif
            COMMIT;
            SQL
              } | $compose exec -T postgres psql \
                -U "$POSTGRES_USER_STAGING" \
                -d "$POSTGRES_DB_STAGING" \
                --set ON_ERROR_STOP=1 \
                --set="version=$version" \
                --set="checksum=$checksum"
            }

            for migration in \
              backend/database/migrations/0039_schema_migrations.sql \
              backend/database/migrations/0040_transaction_integrity_checks.sql \
              backend/database/migrations/0041_validate_transaction_integrity_checks.sql \
              backend/database/migrations/0000_staging_catchup_schema_drift.sql \
              backend/database/migrations/0035_users_email.sql \
              backend/database/migrations/2026-10-27_auth_user_columns.sql \
              backend/database/migrations/2026-10-27_archive_entities.sql \
              backend/database/migrations/2026-10-27_audit_logs.sql \
              backend/database/migrations/0037_approval_matrix_permissions.sql \
              backend/database/migrations/0038_one_active_invoice_per_meta.sql
            do
              test -f "$migration"
              apply_migration "$migration"
            done
            test -f audit_staging_integrity.sql
            $compose exec -T postgres psql \
              -U "$POSTGRES_USER_STAGING" \
              -d "$POSTGRES_DB_STAGING" \
              --set ON_ERROR_STOP=1 < audit_staging_integrity.sql
            $compose up -d backend frontend
            backend_id="$($compose ps -q backend)"
            test -n "$backend_id"
            upload_mount="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/uploads"}}{{.Name}}{{end}}{{end}}' "$backend_id")"
            test "$upload_mount" = "$UPLOAD_VOLUME"
            echo "Verified persistent upload mount: $upload_mount"

      - name: Health check
        run: |
          sleep 5
          curl -f http://${{ secrets.STAGING_SSH_HOST }}:8091/health
          curl -f http://${{ secrets.STAGING_SSH_HOST }}:8091/ready

  # Manual post-deployment smoke check. It is intentionally not run on every
  # push because this workflow does not deploy production automatically.
  smoke-production:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Check production liveness and readiness
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          test -n "$PRODUCTION_BASE_URL"
          chmod +x ops/smoke_check.sh
          ./ops/smoke_check.sh "$PRODUCTION_BASE_URL"
